 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Atefullah Zafar Zoi | Complete Responsive Portfolio</title>
    <!-- Tailwind CSS + Font Awesome + Google Fonts + Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .primary-gradient { background: linear-gradient(135deg, #4f46e5, #ec4899); }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hover-scale:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        /* Fix canvas responsiveness */
        canvas { max-width: 100% !important; height: auto !important; }
        @media (max-width: 480px) {
            .small-text { font-size: 0.7rem; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50 to-pink-50">

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ---------- Skills Bar Chart (fully responsive, small fonts) ----------
    const SkillsChart = () => {
        const chartRef = useRef(null);
        let instance = null;
        const init = () => {
            if (!chartRef.current) return;
            if (instance) instance.destroy();
            const ctx = chartRef.current.getContext('2d');
            instance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['HTML', 'CSS', 'JS', 'React', 'TW', 'Py', 'Java', 'SQL', 'SEO', 'Git'],
                    datasets: [{ label: '', data: [92,88,86,82,90,75,70,80,78,85], backgroundColor: '#4f46e5', borderRadius: 4, barPercentage: 0.6 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false }, tooltip: { bodyFont: { size: 9 } } },
                    scales: {
                        y: { max: 100, ticks: { font: { size: 8 }, stepSize: 25 }, grid: { lineWidth: 0.5 } },
                        x: { ticks: { font: { size: 7 }, rotation: 35, autoSkip: true }, grid: { display: false } }
                    },
                    layout: { padding: { top: 5, bottom: 5 } }
                }
            });
        };
        useEffect(() => { init(); window.addEventListener('resize', init); return () => { window.removeEventListener('resize', init); if(instance) instance.destroy(); }; }, []);
        return <canvas ref={chartRef} style={{ width: '100%', height: 'auto', maxHeight: '150px' }}></canvas>;
    };

    // ---------- Language Doughnut (very compact) ----------
    const LanguageChart = () => {
        const chartRef = useRef(null);
        let instance = null;
        const init = () => {
            if (!chartRef.current) return;
            if (instance) instance.destroy();
            const ctx = chartRef.current.getContext('2d');
            instance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['P', 'Pe', 'E'],
                    datasets: [{ data: [100,95,85], backgroundColor: ['#10b981','#4f46e5','#ec4899'], cutout: '80%', borderWidth: 0, radius: '70%' }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 7 }, boxWidth: 6, padding: 2 } }, tooltip: { enabled: false } },
                    layout: { padding: 0 }
                }
            });
        };
        useEffect(() => { init(); window.addEventListener('resize', init); return () => { window.removeEventListener('resize', init); if(instance) instance.destroy(); }; }, []);
        return <canvas ref={chartRef} style={{ width: '90px', height: '90px', margin: '0 auto' }}></canvas>;
    };

    // ---------- Grades Chart (compact) ----------
    const GradesChart = () => {
        const chartRef = useRef(null);
        let instance = null;
        const init = () => {
            if (!chartRef.current) return;
            if (instance) instance.destroy();
            const ctx = chartRef.current.getContext('2d');
            instance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['10th','11th','12th'],
                    datasets: [
                        { label: '%', data: [96,98,99], type: 'bar', backgroundColor: '#ec4899', borderRadius: 6, barPercentage: 0.5, order: 2 },
                        { label: 'Trend', data: [96,98,99], type: 'line', borderColor: '#4f46e5', borderWidth: 2, fill: false, tension: 0.2, order: 1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'top', labels: { font: { size: 8 } } }, tooltip: { bodyFont: { size: 9 } } },
                    scales: { y: { min: 85, max: 100, ticks: { font: { size: 8 } } }, x: { ticks: { font: { size: 8 } } } }
                }
            });
        };
        useEffect(() => { init(); window.addEventListener('resize', init); return () => { window.removeEventListener('resize', init); if(instance) instance.destroy(); }; }, []);
        return <canvas ref={chartRef} style={{ width: '100%', height: 'auto', maxHeight: '160px' }}></canvas>;
    };

    // ---------- Projects Data (8 projects with real images) ----------
    const projects = [
        { title: "Supermarket Management", desc: "Full inventory & billing", img: "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&h=300&fit=crop", icon: "fas fa-store", tags: ["React","Node"] },
        { title: "Bank Management System", desc: "Accounts & transactions", img: "https://images.unsplash.com/photo-1501167786227-4cba60f6d58f?w=500&h=300&fit=crop", icon: "fas fa-university", tags: ["Python","Django"] },
        { title: "Hospital Management", desc: "Patients & appointments", img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=500&h=300&fit=crop", icon: "fas fa-hospital-user", tags: ["Java","Spring"] },
        { title: "Fruit Portfolio", desc: "Exotic fruit showcase", img: "https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=500&h=300&fit=crop", icon: "fas fa-apple-alt", tags: ["HTML","CSS"] },
        { title: "Titanic Analysis", desc: "Data & survival prediction", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&h=300&fit=crop", icon: "fas fa-chart-line", tags: ["Python","Pandas"] },
        { title: "HTML/CSS/JS Games", desc: "Tic-Tac-Toe, Snake", img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=500&h=300&fit=crop", icon: "fas fa-gamepad", tags: ["JS","Canvas"] },
        { title: "Typing Master", desc: "Speed & accuracy test", img: "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b53?w=500&h=300&fit=crop", icon: "fas fa-keyboard", tags: ["React","Tailwind"] },
        { title: "Online HTML Exam", desc: "Interactive quiz system", img: "https://images.unsplash.com/photo-1434030216411-0b793f4f4173?w=500&h=300&fit=crop", icon: "fas fa-file-alt", tags: ["JS","AJAX"] }
    ];

    const Portfolio = () => {
        const [menuOpen, setMenuOpen] = useState(false);
        const links = ['Home','About','Education','Skills','Projects','Contact'];

        const skillIcons = [
            { name: 'HTML5', icon: 'fab fa-html5', color: '#e34c26' }, { name: 'CSS3', icon: 'fab fa-css3-alt', color: '#264de4' },
            { name: 'JavaScript', icon: 'fab fa-js', color: '#f7df1e' }, { name: 'React', icon: 'fab fa-react', color: '#61dafb' },
            { name: 'Tailwind', icon: 'fas fa-wind', color: '#06b6d4' }, { name: 'Python', icon: 'fab fa-python', color: '#3776ab' },
            { name: 'Java', icon: 'fab fa-java', color: '#007396' }, { name: 'SQL', icon: 'fas fa-database', color: '#4479a1' },

        return (
            <div>
                {/* Navigation */}
                <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-lg shadow-md">
                    <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="text-xl md:text-2xl font-extrabold"><span className="gradient-text">Atefullah</span> <span className="text-gray-700">Zafar Zoi</span></div>
                        <div className="hidden md:flex space-x-6 font-medium">
                            {links.map(l => <a key={l} href={`#${l.toLowerCase()}`} className="hover:text-indigo-600 transition">{l}</a>)}
                        </div>
                        <button className="md:hidden text-2xl" onClick={() => setMenuOpen(!menuOpen)}><i className={`fas ${menuOpen ? 'fa-times' : 'fa-bars'}`}></i></button>
                    </div>
                    {menuOpen && <div className="md:hidden bg-white/95 py-3 px-5 flex flex-col space-y-2 border-t">{links.map(l => <a key={l} href={`#${l.toLowerCase()}`} onClick={()=>setMenuOpen(false)} className="text-gray-700 hover:text-indigo-600">{l}</a>)}</div>}
                </nav>

                {/* Hero Section */}
                <section id="home" className="max-w-6xl mx-auto px-5 py-12 md:py-20 flex flex-col md:flex-row items-center gap-10">
                    <div className="flex-1 text-center md:text-left">
                        <span className="inline-block px-4 py-1 rounded-full bg-indigo-100 text-indigo-700 text-sm"> Web Lover & Developer</span>
                        <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold mt-4">Atefullah <span className="gradient-text">Zafar Zoi</span></h1>
                        <p className="text-lg sm:text-xl text-gray-600 mt-2">Son of Zafar Khan | CS Student @ Kandahar University</p>
                        <p className="text-gray-500 mt-4 max-w-md mx-auto md:mx-0">React, Tailwind, Python, Java, SQL — building modern full-stack systems.</p>
                        <div className="flex flex-wrap gap-4 justify-center md:justify-start mt-6">
                            <a href="#contact" className="px-6 py-3 bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-700 transition"><i className="fas fa-paper-plane mr-2"></i> Hire Me</a>
                            <a href="https://github.com/atefullahdarman/Bank-Static-Website" className="px-6 py-3 border border-gray-300 rounded-full hover:bg-gray-100 transition"><i className="fab fa-github mr-2"></i> GitHub</a>
                        </div>
                    </div>
                    <div className="flex-1 flex justify-center">
                        <div className="w-44 h-44 sm:w-56 sm:h-56 md:w-64 md:h-64 rounded-full primary-gradient p-1 shadow-xl">
                            <div className="w-full h-full rounded-full bg-white flex items-center justify-center overflow-hidden">
                                {/* ========== TODO: PUT YOUR PROFILE IMAGE HERE ========== */}
                                {/* Replace 'your-photo.jpg' with your actual image file name */}
                                <img 
                                    src="darman1.png"   // <-- CHANGE THIS TO YOUR IMAGE FILE NAME
                                    alt="Atefullah Zafar Zoi"
                                    className="w-full h-full object-cover"
                                    
                                />
                               
                               
                            </div>
                        </div>
                    </div>
                </section>

                {/* About */}
                <section id="about" className="bg-white/80 rounded-3xl mx-4 md:mx-12 p-6 md:p-8 shadow-xl my-10">
                    <div className="max-w-5xl mx-auto"><h2 className="text-3xl md:text-4xl font-bold text-center mb-6"><span className="border-b-4 border-indigo-500 pb-2">About Me</span></h2>
                    <div className="grid md:grid-cols-2 gap-8"><div><p className="text-gray-700 text-lg">I'm Atefullah, a passionate web developer and CS student at <strong>Kandahar University</strong>. I passed Kankor exam and joined CS faculty with excellence.</p><div className="mt-5 bg-indigo-50 p-4 rounded-2xl"><i className="fas fa-trophy text-yellow-500 text-2xl"></i><p className="font-bold mt-1">🎓 2nd Rank at Nooralmadaris High School (1402)</p><p>10th:96% | 11th:98% | 12th:99%</p></div></div>
                    <div><p><i className="fas fa-language text-indigo-600 w-6"></i> <strong>Languages:</strong> Pashto 100%, Persian 95%, English 85%</p><p className="mt-2"><i className="fas fa-laptop-code text-indigo-600 w-6"></i> <strong>Tech:</strong> HTML, CSS, JS, React, Tailwind, Python, Java, SQL, SEO, Git</p><p className="mt-2"><i className="fas fa-university text-indigo-600 w-6"></i> <strong>University:</strong> Kandahar University (2023-Present)</p></div></div></div>
                </section>

                {/* Education + Grades */}
                <section id="education" className="py-12 px-5 max-w-6xl mx-auto"><h2 className="text-3xl md:text-4xl font-bold text-center mb-8">Education & Grades</h2><div className="grid md:grid-cols-2 gap-8"><div className="bg-white p-6 rounded-3xl shadow-lg"><i className="fas fa-school text-3xl text-indigo-600"></i><h3 className="text-2xl font-bold mt-2">Nooralmadaris High School</h3><p className="mt-2"> Graduated 1402 (2023) with second rank</p><p> 10th:96% | 11th:98% | 12th:99%</p><div className="mt-4 bg-amber-50 p-3 rounded-xl text-center"><i className="fas fa-certificate text-amber-600"></i> Certificate of Excellence</div></div><div className="bg-white p-5 rounded-3xl shadow-lg"><h3 className="text-xl font-semibold text-center"> Academic Performance</h3><GradesChart/></div></div></section>

                {/* Skills + Charts (fully responsive) */}
                <section id="skills" className="py-12 px-5 bg-gradient-to-r from-indigo-50/50 to-pink-50/50 rounded-t-3xl">
                    <div className="max-w-7xl mx-auto"><h2 className="text-3xl md:text-4xl font-bold text-center mb-6"> Technical Skills & Charts</h2>
                    <div className="grid lg:grid-cols-2 gap-8">
                        <div><div className="bg-white p-4 rounded-2xl shadow-md"><h3 className="text-lg font-bold mb-2 flex gap-2"><i className="fab fa-react text-indigo-500"></i> Core Stack</h3><div className="grid grid-cols-2 sm:grid-cols-3 gap-2">{skillIcons.map(s=> <div key={s.name} className="flex flex-col items-center p-1"><i className={`${s.icon} text-xl sm:text-2xl`} style={{color:s.color}}></i><span className="text-[10px] sm:text-xs">{s.name}</span></div>)}</div></div>
                        <div className="bg-white p-4 rounded-2xl shadow-md mt-5 text-center"><h3 className="text-lg font-bold mb-1"> Languages</h3><LanguageChart/><div className="flex justify-center gap-3 text-[15px] mt-1"><span>🔵 Pashto</span><span>🟣 Persian</span><span>🩷 English</span></div></div></div>
                        <div className="bg-white p-4 rounded-2xl shadow-md"><h3 className="text-lg font-bold mb-2">Dev Skills Graph</h3><SkillsChart/></div>
                    </div></div>
                </section>

                {/* Projects Gallery */}
                <section id="projects" className="py-16 px-5 max-w-7xl mx-auto"><h2 className="text-3xl md:text-4xl font-bold text-center mb-4"> My Real-World Projects</h2><p className="text-center text-gray-600 mb-10">Supermarket · Bank · Hospital · Fruit · Titanic · Games · Typing Master · Online Exam</p><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">{projects.map((p,idx)=> (<div key={idx} className="bg-white rounded-2xl overflow-hidden shadow-lg hover-scale transition"><img src={p.img} alt={p.title} className="w-full h-40 object-cover" loading="lazy" onError={(e)=>{e.target.src='https://picsum.photos/id/26/400/250';}} /><div className="p-4"><div className="flex items-center gap-2 text-lg font-bold"><i className={`${p.icon} text-indigo-600`}></i> {p.title}</div><p className="text-gray-600 text-sm mt-1">{p.desc}</p><div className="flex flex-wrap gap-1 mt-2">{p.tags.map(t=> <span key={t} className="bg-gray-100 text-[10px] px-2 py-0.5 rounded-full">{t}</span>)}</div></div></div>))}</div></section>

                {/* Contact + Social */}
                <section id="contact" className="py-12 px-5 bg-gray-900 text-white rounded-t-3xl"><div className="max-w-5xl mx-auto text-center"><h2 className="text-3xl md:text-4xl font-bold mb-5">Let's Connect</h2><p className="text-gray-300 mb-6">Available for freelance & collaborations.</p><div className="flex flex-wrap justify-center gap-6 text-lg"><a href="https://wa.me/93731597286" className="hover:text-green-400 transition flex gap-2"><i className="fab fa-whatsapp text-xl"></i> WhatsApp</a><a href="https://github.com/atefullahdarman/Bank-Static-Website" className="hover:text-blue-400 transition flex gap-2"><i className="fab fa-github text-xl"></i> GitHub</a><a href="https://www.linkedin.com/in/atefullah-zafar-zoy-2a7019399?utm_source=share_via&utm_content=profile&utm_medium=member_android" className="hover:text-blue-400 transition flex gap-2"><i className="fab fa-linkedin text-xl"></i> LinkedIn</a><a href="#" className="hover:text-blue-400 transition flex gap-2"><i className="fas fa-envelope"></i> atefullah@example.com</a></div><div className="mt-10 pt-5 border-t border-gray-700 text-gray-400 text-sm"> 2025 © Atefullah Zafar Zoi </div></div></section>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Portfolio />);
</script>
</body>
</html>
